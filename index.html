<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Influencer Workflow</title>
<style>
:root{--bg:#f4f6f5;--sf:#fff;--tx:#18211f;--mu:#68736f;--bd:#dde3e0;--pr:#0f766e;--pt:#fff;--g:#e8ecea;--gt:#44504c;--b:#dbeafe;--bt:#1e40af;--a:#fef3c7;--at:#92400e;--k:#dcfce7;--kt:#166534;--r:#fee2e2;--rt:#991b1b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101514;--sf:#1a2220;--tx:#e8eeec;--mu:#94a09b;--bd:#2c3835;--pr:#2dd4bf;--pt:#06201d;--g:#2a3331;--gt:#b4c0bb;--b:#1e3a5f;--bt:#bfdbfe;--a:#4a3a10;--at:#fde68a;--k:#14391f;--kt:#bbf7d0;--r:#4c1d1d;--rt:#fecaca}}
:root[data-theme="dark"]{--bg:#101514;--sf:#1a2220;--tx:#e8eeec;--mu:#94a09b;--bd:#2c3835;--pr:#2dd4bf;--pt:#06201d;--g:#2a3331;--gt:#b4c0bb;--b:#1e3a5f;--bt:#bfdbfe;--a:#4a3a10;--at:#fde68a;--k:#14391f;--kt:#bbf7d0;--r:#4c1d1d;--rt:#fecaca}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Noto Sans Thai","Sarabun",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx)}
main{padding:14px 14px 96px;max-width:1000px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--sf);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;font:inherit;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:18px;font-weight:400}
nav button.on{color:var(--pr);font-weight:600}
.lg{display:none}
@media(min-width:800px){body{display:flex}nav{position:sticky;top:0;height:100vh;width:200px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding:16px 8px;flex:none}nav button{flex:none;text-align:left;font-size:15px;padding:10px 12px;border-radius:8px}nav button b{display:inline;margin-right:8px}nav button.on{background:var(--g)}main{flex:1;padding:24px 28px}.lg{display:block;font-weight:700;padding:4px 12px 14px;color:var(--pr)}}
h1{font-size:20px;margin:0 0 12px}h3{margin:0 0 10px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar h1{flex:1;margin:0;min-width:140px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.bar input,.bar select{width:auto;flex:1;min-width:120px}
textarea{min-height:90px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pr);outline-offset:1px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}label input,label select,label textarea{margin-top:3px;color:var(--tx);font-size:15px}
.bt{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:7px 12px;border-radius:8px;cursor:pointer;min-height:36px}
.bt.p{background:var(--pr);color:var(--pt);border-color:var(--pr);font-weight:600}.bt.d{color:var(--rt)}.bt.s{padding:4px 9px;font-size:13px;min-height:30px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;text-align:left;font:inherit;color:var(--tx);cursor:pointer}
.st strong{display:block;font-size:26px;line-height:1.1}.st span{font-size:13px;color:var(--mu)}
.st.hot{border-color:var(--rt)}.st.hot strong{color:var(--rt)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.mu{color:var(--mu);font-size:13px}.nm{font-weight:600}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;background:var(--g);color:var(--gt);white-space:nowrap}
.bd.b{background:var(--b);color:var(--bt)}.bd.a{background:var(--a);color:var(--at)}.bd.k{background:var(--k);color:var(--kt)}.bd.r{background:var(--r);color:var(--rt)}
.late{color:var(--rt);font-weight:600}
.lk{display:inline-block;padding:2px 9px;border:1px solid var(--bd);border-radius:6px;font-size:13px;color:var(--pr);text-decoration:none}
.card select.q{width:auto;padding:3px 8px;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:32px 12px}
.mb{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--sf);width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:16px;border-radius:14px 14px 0 0}
@media(min-width:700px){.mb{align-items:center}.md{border-radius:14px}}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:620px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:middle}td input{padding:4px 6px;font-size:13px}
#t{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:8px;z-index:30;display:none;font-size:14px}
.warn{background:var(--a);color:var(--at);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
</style></head><body>
<nav id="nav"></nav><main id="main"></main><div id="m"></div><div id="t"></div>
<script>
var KEY='iwms1',S={inf:[],camp:[],con:[]},V='dash',F={part:'',camp:'',st:'',grp:'',when:'',q:''},IQ={q:'',t:''},IMP=[],memOnly=false;
try{var raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){memOnly=true}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
var P1=['ยังไม่ได้ติดต่อ','ติดต่อแล้ว','รอการตอบกลับ','ติดตามแล้ว','ได้รับราคาแล้ว','กำลังเจรจา','ยืนยันราคาแล้ว','ปฏิเสธงาน','ไม่สามารถติดต่อได้'];
var P2=['ยังไม่ได้ติดต่อ','ส่งงานเสนอแล้ว','รอการตอบกลับ','ติดตามแล้ว','สนใจรับงาน','กำลังพิจารณา','ยืนยันรับงาน','ปฏิเสธงาน','ไม่สามารถติดต่อได้'];
var CLOSED=['ปฏิเสธงาน','ไม่สามารถติดต่อได้','ยืนยันราคาแล้ว','ยืนยันรับงาน'],WAIT=['ติดต่อแล้ว','ส่งงานเสนอแล้ว','รอการตอบกลับ','ติดตามแล้ว'],INTR=['ได้รับราคาแล้ว','กำลังเจรจา','ยืนยันราคาแล้ว','สนใจรับงาน','กำลังพิจารณา','ยืนยันรับงาน'];
var COL={'ยังไม่ได้ติดต่อ':'','ติดต่อแล้ว':'b','ส่งงานเสนอแล้ว':'b','รอการตอบกลับ':'a','ติดตามแล้ว':'a','กำลังเจรจา':'a','กำลังพิจารณา':'a','ปฏิเสธงาน':'r','ไม่สามารถติดต่อได้':'r'};
var TYPES=['Beauty','Food','Lifestyle','Fashion','Travel','Tech','Family','อื่นๆ'],CH=['TikTok','Instagram','Facebook','Lemon8','LINE','Email','อื่นๆ'],CS=['ร่าง','กำลังดำเนินการ','เสร็จสิ้น','ยกเลิก'];
var SOC=['tiktok','instagram','facebook','lemon8'],SN={tiktok:'TikTok',instagram:'Instagram',facebook:'Facebook',lemon8:'Lemon8',line:'LINE',email:'Email',other:'อื่นๆ'};
var $=function(s){return document.querySelector(s)};
function h(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return String(n).padStart(2,'0')}
function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ds(d)}
function fd(d){return d?d.split('-').reverse().join('/'):'-'}
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function toast(t){var e=$('#t');e.textContent=t;e.style.display='block';clearTimeout(toast.k);toast.k=setTimeout(function(){e.style.display='none'},2200)}
function inf(id){return S.inf.find(function(x){return x.id==id})}
function camp(id){return S.camp.find(function(x){return x.id==id})}
function ST(p){return p==1?P1:P2}
function isClosed(c){return CLOSED.indexOf(c.st)>=0}
function isDue(c){return !isClosed(c)&&(c.st==='ยังไม่ได้ติดต่อ'||(c.next&&c.next<=today()))}
function isOver(c){return !isClosed(c)&&c.next&&c.next<today()}
var GRP={wait:function(c){return WAIT.indexOf(c.st)>=0},contacted:function(c){return c.st!=='ยังไม่ได้ติดต่อ'},replied:function(c){return INTR.indexOf(c.st)>=0||c.st==='ปฏิเสธงาน'},intr:function(c){return INTR.indexOf(c.st)>=0},rej:function(c){return c.st==='ปฏิเสธงาน'}};
function badge(s){return '<span class="bd '+(COL[s]===undefined?'k':COL[s])+'">'+h(s)+'</span>'}
function href(u){u=String(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u}
/* ---------- link utils ---------- */
function platOf(u){var x;try{x=new URL(href(u)).hostname.toLowerCase().replace(/^(www|m|mobile|vt|vm|l)\./,'')}catch(e){return 'other'}
 if(/tiktok\.com$/.test(x))return 'tiktok';if(/instagram\.com$|instagr\.am$/.test(x))return 'instagram';if(/facebook\.com$|fb\.com$|fb\.watch$|fb\.me$/.test(x))return 'facebook';if(/lemon8/.test(x))return 'lemon8';if(/line\.me$|lin\.ee$/.test(x))return 'line';return 'other'}
function norm(u){u=String(u||'').trim();if(!u)return '';if(u.indexOf('@')>0&&!/^https?:/i.test(u)&&u.indexOf('/')<0)return 'mail:'+u.toLowerCase();
 try{var o=new URL(href(u)),p=o.pathname.replace(/\/+$/,'').toLowerCase(),id=o.searchParams.get('id');return o.hostname.toLowerCase().replace(/^(www|m|mobile)\./,'')+p+(id?'?id='+id:'')}catch(e){return u.toLowerCase()}}
function keysOf(i){var k=[];SOC.concat(['line','email']).forEach(function(f){if(i[f]){var n=f==='email'?'mail:'+i.email.toLowerCase():(/^https?:|\.|\//i.test(i[f])?norm(i[f]):'line:'+i[f].toLowerCase().replace(/^@/,''));k.push(n)}});return k}
function findDup(o,ig){var k=keysOf(o);return S.inf.find(function(x){if(x.id===ig)return false;if(o.name&&x.name.toLowerCase()===o.name.toLowerCase())return true;return keysOf(x).some(function(a){return k.indexOf(a)>=0})})}
function guessName(u){var m=String(u).match(/@([\w.\-]+)/);if(m)return m[1];try{var p=new URL(href(u)),s=p.pathname.split('/').filter(Boolean);if(platOf(u)==='instagram'&&s[0]&&['p','reel','reels','stories'].indexOf(s[0])<0)return s[0];if(platOf(u)==='facebook'&&s[0]&&s[0]!=='profile.php'&&s[0]!=='share')return s[0]}catch(e){}return ''}
/* ---------- modal ---------- */
function closeM(){$('#m').innerHTML=''}
function modal(t,body,ok,lbl){$('#m').innerHTML='<div class="mb" onclick="if(event.target==this)closeM()"><div class="md" role="dialog"><h3>'+t+'</h3><div>'+body+'</div><div class="ma"><button class="bt" onclick="closeM()">ปิด</button>'+(ok?'<button class="bt p" id="mok">'+(lbl||'บันทึก')+'</button>':'')+'</div></div></div>';if(ok)$('#mok').onclick=ok}
function ask(msg,fn,lbl){modal('ยืนยัน','<p>'+h(msg)+'</p>',function(){closeM();fn()},lbl||'ยืนยัน')}
function fld(id,l,val,type){return '<label>'+l+'<input id="'+id+'" type="'+(type||'text')+'" value="'+h(val)+'"></label>'}
function area(id,l,val){return '<label>'+l+'<textarea id="'+id+'">'+h(val)+'</textarea></label>'}
function sel(id,l,opts,val,dis){return '<label>'+l+'<select id="'+id+'"'+(dis?' disabled':'')+'>'+opts.map(function(o){var a=Array.isArray(o)?o:[o,o];return '<option value="'+h(a[0])+'"'+(a[0]==val?' selected':'')+'>'+h(a[1])+'</option>'}).join('')+'</select></label>'}
/* ---------- nav / render ---------- */
var NAV=[['dash','📊','ภาพรวม'],['fu','✅','ติดตาม'],['inf','👥','Influencer'],['camp','📣','แคมเปญ'],['imp','🔗','นำเข้าลิงก์']];
function go(x){V=x;render();window.scrollTo(0,0)}
function render(){$('#nav').innerHTML='<div class="lg">Influencer Workflow</div>'+NAV.map(function(n){return '<button class="'+(V===n[0]?'on':'')+'" onclick="go(\''+n[0]+'\')"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join('');
 var w=memOnly?'<div class="warn">เบราว์เซอร์นี้ไม่อนุญาตให้บันทึกข้อมูลถาวร ข้อมูลจะหายเมื่อปิดหน้านี้</div>':'';
 $('#main').innerHTML=w+({dash:vDash,fu:vFu,inf:vInf,camp:vCamp,imp:vImp})[V]()}
/* ---------- dashboard ---------- */
function showFu(f){F={part:'',camp:'',st:'',grp:'',when:'',q:''};Object.assign(F,f);go('fu')}
function vDash(){var c=S.con,n=function(f){return c.filter(f).length},t=today();
 var cards=[['แคมเปญที่ดำเนินการ',S.camp.filter(function(x){return x.status==='กำลังดำเนินการ'}).length,'camp',0],['ติดต่อทั้งหมด',n(GRP.contacted),{grp:'contacted'}],['รอการตอบกลับ',n(GRP.wait),{grp:'wait'}],['ต้องติดตามวันนี้',n(function(x){return isDue(x)&&!isOver(x)}),{when:'today'}],['เกินกำหนด',n(isOver),{when:'over'},1],['ตอบกลับแล้ว',n(GRP.replied),{grp:'replied'}],['สนใจรับงาน',n(GRP.intr),{grp:'intr'}],['ปฏิเสธงาน',n(GRP.rej),{grp:'rej'}]];
 var due=c.filter(isDue).sort(function(a,b){return (a.next||'0')<(b.next||'0')?-1:1}).slice(0,30);
 return '<h1>ภาพรวมวันนี้ · '+fd(t)+'</h1><div class="grid">'+cards.map(function(x,i){return '<button class="st'+(x[3]&&x[1]?' hot':'')+'" onclick="'+(x[2]==='camp'?"go('camp')":'showFu('+h(JSON.stringify(x[2])).replace(/"/g,'&quot;')+')')+'"><strong>'+x[1]+'</strong><span>'+x[0]+'</span></button>'}).join('')+'</div>'
 +'<h3>ต้องดำเนินการวันนี้ ('+c.filter(isDue).length+')</h3>'+(due.length?due.map(function(x){return fuRow(x)}).join(''):'<div class="empty">ไม่มีรายการค้าง เพิ่มรายการติดต่อได้ที่หน้าแคมเปญ</div>')}
/* ---------- follow-up ---------- */
function fuRow(c){var i=inf(c.inf),m=camp(c.camp);if(!i||!m)return '';
 return '<div class="card"><div class="row"><span class="nm">'+h(i.name)+'</span><span class="bd '+(c.part==1?'b':'a')+'">PART '+c.part+'</span><span class="mu">'+h(m.name)+'</span><span class="sp"></span><select class="q" aria-label="สถานะ" onchange="setSt(\''+c.id+'\',this.value)">'+ST(c.part).map(function(s){return '<option'+(s===c.st?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>'
 +'<div class="row mu" style="margin-top:6px"><span>ช่องทาง: '+h(c.ch||'-')+'</span><span>ล่าสุด: '+fd(c.last)+'</span><span class="'+(isOver(c)?'late':'')+'">ติดตาม: '+fd(c.next)+(isOver(c)?' (เกินกำหนด)':'')+'</span><span>ติดตามแล้ว '+c.cnt+' ครั้ง</span></div>'
 +(c.note?'<div class="mu" style="margin-top:4px">📝 '+h(c.note)+'</div>':'')
 +'<div class="row" style="margin-top:8px">'+badge(c.st)+links(i)+'<span class="sp"></span><button class="bt s p" onclick="logM(\''+c.id+'\')">บันทึกการติดต่อ</button><button class="bt s" onclick="histM(\''+c.id+'\')">ประวัติ</button><button class="bt s d" onclick="delCon(\''+c.id+'\')">ลบ</button></div></div>'}
function links(i){var o='';SOC.forEach(function(f){if(i[f])o+='<a class="lk" target="_blank" rel="noopener noreferrer" href="'+h(href(i[f]))+'">'+SN[f]+'</a> '});if(i.line)o+=/^https?:|line\.me|lin\.ee/i.test(i.line)?'<a class="lk" target="_blank" rel="noopener noreferrer" href="'+h(href(i.line))+'">LINE</a> ':'<span class="bd">LINE: '+h(i.line)+'</span> ';if(i.email)o+='<a class="lk" href="mailto:'+h(i.email)+'">Email</a>';return o}
function vFu(){var l=fil(),ps=[['','ทุก Part'],['1','PART 1 สอบถามราคา'],['2','PART 2 เสนอแคมเปญ']],all=P1.concat(P2).filter(function(x,i,a){return a.indexOf(x)===i});
 return '<div class="bar"><h1>Follow-up Center</h1></div><div class="bar"><input id="fq" placeholder="ค้นหาชื่อ Influencer" value="'+h(F.q)+'" oninput="F.q=this.value;fuList()">'
 +'<select onchange="F.part=this.value;render()">'+ps.map(function(p){return '<option value="'+p[0]+'"'+(F.part==p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select>'
 +'<select onchange="F.camp=this.value;render()"><option value="">ทุกแคมเปญ</option>'+S.camp.map(function(m){return '<option value="'+m.id+'"'+(F.camp==m.id?' selected':'')+'>'+h(m.name)+'</option>'}).join('')+'</select>'
 +'<select onchange="F.st=this.value;render()"><option value="">ทุกสถานะ</option>'+all.map(function(s){return '<option'+(F.st==s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>'
 +'<select onchange="F.when=this.value;render()">'+[['','ทุกวันที่'],['due','ต้องทำตอนนี้'],['today','ติดตามวันนี้'],['over','เกินกำหนด'],['up','กำหนดในอนาคต']].map(function(p){return '<option value="'+p[0]+'"'+(F.when==p[0]?' selected':'')+'>'+p[1]+'</option>'}).join('')+'</select></div>'
 +(F.grp?'<div class="mu" style="margin-bottom:8px">กรองกลุ่ม: '+F.grp+' <button class="bt s" onclick="F.grp=\'\';render()">ล้าง</button></div>':'')+'<div id="fl">'+fuHtml(l)+'</div>'}
function fil(){var q=F.q.toLowerCase(),t=today();return S.con.filter(function(c){var i=inf(c.inf);if(!i||!camp(c.camp))return false;if(F.part&&c.part!=F.part)return false;if(F.camp&&c.camp!=F.camp)return false;if(F.st&&c.st!==F.st)return false;if(F.grp&&!GRP[F.grp](c))return false;
 if(F.when==='due'&&!isDue(c))return false;if(F.when==='today'&&!(isDue(c)&&!isOver(c)))return false;if(F.when==='over'&&!isOver(c))return false;if(F.when==='up'&&!(c.next>t&&!isClosed(c)))return false;if(q&&i.name.toLowerCase().indexOf(q)<0)return false;return true}).sort(function(a,b){return (a.next||'9')<(b.next||'9')?-1:1})}
function fuHtml(l){return l.length?'<div class="mu" style="margin-bottom:6px">'+l.length+' รายการ</div>'+l.map(fuRow).join(''):'<div class="empty">ไม่พบรายการ</div>'}
function fuList(){$('#fl').innerHTML=fuHtml(fil())}
